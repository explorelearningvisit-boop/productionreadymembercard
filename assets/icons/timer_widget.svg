<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="timerGrad" x1="16" y1="16" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="timeGlowBg" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowTimer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Glow Card -->
  <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#timeGlowBg)"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="23.5" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Stopwatch / Timer Graphic -->
  <g filter="url(#shadowTimer)">
    <!-- Top Button Crown -->
    <rect x="44" y="16" width="8" height="8" rx="2" fill="#A855F7"/>
    <path d="M42 24H54" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Angled Lap Trigger -->
    <rect x="64.5" y="24" width="6" height="4" rx="1.5" transform="rotate(40 64.5 24)" fill="#6366F1"/>

    <!-- Clock Outer Ring -->
    <circle cx="48" cy="54" r="26" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="48" cy="54" r="26" stroke="url(#timeGlowrad)" stroke-width="4"/>

    <!-- Outer Active Arc Track -->
    <path d="M48 32A22 22 0 1 1 30 40" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute Dial Ticks -->
    <circle cx="48" cy="36" r="1.5" fill="#6366F1"/>
    <circle cx="66" cy="54" r="1.5" fill="#6366F1"/>
    <circle cx="48" cy="72" r="1.5" fill="#6366F1"/>
    <circle cx="30" cy="54" r="1.5" fill="#6366F1"/>

    <!-- Clock Center Pivot and Hands -->
    <circle cx="48" cy="54" r="3.5" fill="#4F46E5"/>
    <!-- Hour Hand -->
    <path d="M48 54L48 41" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
    <!-- Minute Hand (at 10-minute / 2 o'clock angle) -->
    <path d="M48 54L59 47" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="48" cy="54" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
