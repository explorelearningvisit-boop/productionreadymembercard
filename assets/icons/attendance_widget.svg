<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="calGrad" x1="12" y1="16" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="calGlow" x1="20" y1="20" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowCal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C3AED" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Glow Card -->
  <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#calGlow)"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="23.5" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Calendar Body -->
  <g filter="url(#shadowCal)">
    <!-- Main Slate -->
    <rect x="20" y="26" width="56" height="50" rx="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="20" y="26" width="56" height="18" rx="14" fill="url(#calGrad)"/>
    <rect x="20" y="34" width="56" height="10" fill="url(#calGrad)"/>

    <!-- Binder rings -->
    <rect x="32" y="18" width="6" height="14" rx="3" fill="#6366F1"/>
    <rect x="58" y="18" width="6" height="14" rx="3" fill="#6366F1"/>
    <circle cx="35" cy="25" r="1.5" fill="#DDD6FE"/>
    <circle cx="61" cy="25" r="1.5" fill="#DDD6FE"/>

    <!-- Calendar Grid / Checkmark Accent -->
    <circle cx="34" cy="53" r="3.5" fill="#8B5CF6"/>
    <circle cx="48" cy="53" r="3.5" fill="#A78BFA"/>
    <circle cx="62" cy="53" r="3.5" fill="#E2E8F0"/>

    <circle cx="34" cy="65" r="3.5" fill="#10B981"/>
    <circle cx="48" cy="65" r="3.5" fill="#10B981"/>
    <!-- Checkmark highlight on active day -->
    <path d="M59 64.5L62 67.5L67 62" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>