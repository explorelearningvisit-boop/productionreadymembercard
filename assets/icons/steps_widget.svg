<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="stepGrad" x1="16" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="stepGlow" x1="10" y1="10" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadowStep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284C7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rounded Plaque -->
  <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#stepGlow)"/>
  <rect x="8.5" y="8.5" width="79" height="79" rx="23.5" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Athletic Sneaker Running Shoe Silhouette -->
  <g filter="url(#shadowStep)">
    <!-- Outsole & Cushion -->
    <path d="M22 66C22 66 26 68 34 68C43 68 52 64 63 65C69 65.5 73 63.5 75 60C76.2 57.8 75 55 71 54C68 53.2 64 54 60 55C52 57 44 55 38 52L26 53C22 53.5 20 57 20 61C20 64 21 65.5 22 66Z" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Shoe Upper / Body -->
    <path d="M26 53L35 38C36.5 35.5 39.5 34 42.5 34.5C45.5 35 48 37.5 49 40.5L52 47C54 46.5 56.5 46.5 59 47.5L66 50.5C70 52 72.5 54.5 71 58C69 61 63 61.5 58 60.5C50 59 42 57 34 55L26 53Z" fill="url(#stepGrad)"/>

    <!-- Sneaker Laces & Speed Streaks -->
    <path d="M38 41L45 44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M41 36L48 39" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Dynamic Motion Trail / Sparks -->
    <circle cx="20" cy="46" r="2.5" fill="#38BDF8"/>
    <circle cx="16" cy="54" r="2" fill="#818CF8"/>
    <path d="M24 38C22 36 19 36 17 37" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 71C32 72 40 72 47 70" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>
