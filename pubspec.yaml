name: bad_gym_member_intelligence
description: BAD GYM Member Intelligence — purple neon member dashboard
publish_to: none
version: 1.0.0+3
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/member_portrait.png
    - assets/material_pack/images/01_member_bodybuilder.webp
    - assets/material_pack/illustrations/02_red_gold_gift_box.webp
    - assets/material_pack/offers-promotions/03_whey_protein_tub.webp
    - assets/material_pack/offers-promotions/04_purple_shaker.webp
    - assets/material_pack/offers-promotions/05_blinkit_grocery_bag.webp
    - assets/material_pack/offers-promotions/06_creatine_tub.webp
    - assets/material_pack/offers-promotions/07_green_shaker.webp
    - assets/material_pack/membership/08_gold_profile_badge_panel.webp
    - assets/material_pack/backgrounds/09_footer_purple_gold_wave.webp
    - assets/material_pack/membership/10_gold_photo_backplate.webp
    - assets/material_pack/ui-components/11_purple_menu_background.webp
    - assets/material_pack/ui-components/12_white_menu_background.webp
    - assets/material_pack/ui-components/13_gold_menu_background.webp
    - assets/material_pack/ui-components/14_green_menu_background.webp
    - assets/material_pack/ui-components/15_purple_progress_bar.webp
    - assets/material_pack/ui-components/16_lavender_status_pill.webp
    - assets/material_pack/ui-components/17_red_status_pill.webp
    - assets/material_pack/ui-components/18_white_status_pill.webp
    - assets/material_pack/ui-components/19_purple_square_button_background.webp
    - assets/material_pack/backgrounds/20_footer_purple_gold_wave.webp
    - assets/material_pack/membership/21_gold_plan_badge_background.webp
    - assets/material_pack/membership/22_green_active_badge_background.webp
    - assets/material_pack/attendance/23_freeze_snowflake_graphic.webp
    - assets/material_pack/payment/24_qr_graphic.webp
    - assets/material_pack/attendance/25_calendar_graphic.webp
    - assets/material_pack/frames/26_master_neon_purple_gold_frame.webp
    - assets/material_pack/advertisements/27_dumbbell_promo_graphic.webp
    - assets/material_pack/offers-promotions/28_protinex_tub.webp
    - assets/material_pack/payment/29_sbi_payment_card_graphic.webp
    - assets/material_pack/membership/30_member_gold_profile_backplate.webp
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
