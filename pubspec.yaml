name: bad_gym_member_intelligence
description: BAD GYM Member Intelligence — purple neon member dashboard
publish_to: none
version: 1.0.0+3
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/material_pack/pulsevault/01_whey_protein_tub_cutout.png
    - assets/material_pack/pulsevault/02_whey_protein_bundle_cutout.png
    - assets/material_pack/pulsevault/03_purple_protein_product_bundle_cutout.png
    - assets/material_pack/pulsevault/04_fat_loss_support_tub_cutout.png
    - assets/material_pack/pulsevault/05_purple_gold_cta_background.png
    - assets/material_pack/pulsevault/06_whey_recovery_tub_cutout.png
    - assets/material_pack/pulsevault/07_creatine_monohydrate_tub_cutout.png
    - assets/material_pack/pulsevault/10_member_bodybuilder_cutout.png
    - assets/material_pack/pulsevault/11_sbi_payment_card_cutout.png
    - assets/material_pack/pulsevault/12_purple_neon_cta_background.png
    - assets/material_pack/pulsevault/13_blinkit_grocery_bag_cutout.png
    - assets/material_pack/pulsevault/14_lavender_glass_cta_background.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf
