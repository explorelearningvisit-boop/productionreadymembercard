name: Android Cloud Build & Multi-Device QA

on:
  push:
    branches: [main, setup/flutter-member-intelligence, chatgpt/design-lab-yellow-festive, chatgpt/ui-ux-remediation]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - ".github/workflows/android-cloud-device.yml"
  pull_request:
    branches: [main, setup/flutter-member-intelligence]
  workflow_dispatch:
    inputs:
      run_device_test:
        description: "Discover Tailnet devices and test every online, configured Android device"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Flutter checks + Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Debounce rapid commits
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "Waiting 30 seconds for a batch of rapid AI commits to finish..."
          sleep 30
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Keep the CI debug signing identity stable between ephemeral runners.
      # This is a QA/debug key only; production release signing must use a protected keystore.
      - name: Restore stable CI debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: badgym-ci-debug-keystore-v1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          missing=()
          [ -d "$ANDROID_HOME/platform-tools" ] || missing+=("platform-tools")
          [ -d "$ANDROID_HOME/platforms/android-36" ] || missing+=("platforms;android-36")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || missing+=("build-tools;36.0.0")
          if [ "${#missing[@]}" -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "${missing[@]}"
          else
            echo "Android SDK packages already present; skipping sdkmanager."
          fi
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle Wrapper permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          test -x "$GITHUB_WORKSPACE/android/gradlew"
          test -f "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          cd android && ./gradlew --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart formatting report
        run: dart format --output=none lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  multi-device-qa:
    name: Tailnet discovery + Android fleet QA
    needs: build-and-test
    if: (github.event_name == 'workflow_dispatch' && inputs.run_device_test == true) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chatgpt/design-lab-yellow-festive' || github.ref == 'refs/heads/chatgpt/ui-ux-remediation'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        name: Download release APK
        with:
          name: bad-gym-android-release-${{ github.sha }}
          path: dist
      - name: Ensure Android platform tools and jq
        shell: bash
        run: |
          missing=()
          command -v adb >/dev/null 2>&1 || missing+=(android-sdk-platform-tools)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get install -y "${missing[@]}"
          else
            echo "adb and jq already available; skipping package installation."
          fi
      - name: Restore paired ADB host identity
        id: check_keys
        env:
          ADB_KEY: ${{ secrets.DEVICE_ADB_PRIVATE_KEY_B64 }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$ADB_KEY" ] || ([ -z "$TS_ID" ] && [ -z "$TS_KEY" ]); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "use_oauth=false" >> "$GITHUB_OUTPUT"
            echo "use_authkey=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tailscale or ADB keys not set in repository secrets. Skipping live device testing."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -n "$TS_ID" ] && [ -n "${{ secrets.TS_AUDIENCE }}" ]; then
              echo "use_oauth=true" >> "$GITHUB_OUTPUT"
              echo "use_authkey=false" >> "$GITHUB_OUTPUT"
            elif [ -n "$TS_KEY" ]; then
              echo "use_oauth=false" >> "$GITHUB_OUTPUT"
              echo "use_authkey=true" >> "$GITHUB_OUTPUT"
            else
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "use_oauth=false" >> "$GITHUB_OUTPUT"
              echo "use_authkey=false" >> "$GITHUB_OUTPUT"
              echo "::error::OAuth client ID requires TS_AUDIENCE, or configure TAILSCALE_AUTHKEY."
              exit 1
            fi
            mkdir -p "$HOME/.android"
            printf '%s' "$ADB_KEY" | base64 --decode > "$HOME/.android/adbkey"
            chmod 600 "$HOME/.android/adbkey"
          fi
      - name: Join Tailscale (OAuth)
        if: steps.check_keys.outputs.configured == 'true' && steps.check_keys.outputs.use_oauth == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          timeout: 3m
          retry: 8
          use-cache: true
      - name: Join Tailscale (Auth Key)
        if: steps.check_keys.outputs.configured == 'true' && steps.check_keys.outputs.use_authkey == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          timeout: 3m
          retry: 8
          use-cache: true
      - name: Discover Tailnet and test all online configured Android devices
        if: steps.check_keys.outputs.configured == 'true'
        env:
          ANDROID_DEVICE_PORTS_JSON: ${{ secrets.ANDROID_DEVICE_PORTS_JSON }}
        shell: bash
        run: |
          # GitHub's bash shell enables errexit by default. Device-side ADB
          # commands can transiently return non-zero while a phone wakes up;
          # record those failures per-device instead of aborting the whole job.
          set +e
          set -u
          set -o pipefail
          mkdir -p device-artifacts
          adb start-server || true

          if [ -z "${ANDROID_DEVICE_PORTS_JSON:-}" ]; then
            echo "::error::Missing ANDROID_DEVICE_PORTS_JSON."
            exit 1
          fi
          printf '%s' "$ANDROID_DEVICE_PORTS_JSON" | jq -e 'type == "object"' >/dev/null || exit 1

          tailscale status --json > device-artifacts/tailnet-status.json || exit 1
          tailscale netcheck > device-artifacts/tailscale-netcheck.txt 2>&1 || true
          jq -r '
            .Peer // {} | to_entries[] |
            [.value.HostName, (.value.TailscaleIPs[0] // ""), (.value.OS // "unknown"), (.value.Online // false)] |
            @tsv
          ' device-artifacts/tailnet-status.json > device-artifacts/tailnet-inventory.tsv

          printf 'hostname\tip\tos\tonline\tadb_port\tresult\n' > device-artifacts/device-results.tsv
          tested=0
          while IFS=$'\t' read -r hostname ip os online; do
            [ -n "$hostname" ] || continue
            case "$ip" in *:*) continue ;; esac
            if [ "$online" != "true" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tOFFLINE_SKIPPED\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi
            if [ "$os" != "android" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tINVENTORY_ONLY\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi

            port=$(jq -r --arg host "$hostname" --arg ip "$ip" '.[$host] // .[$ip] // empty' <<< "$ANDROID_DEVICE_PORTS_JSON")
            if [ -z "$port" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tADB_PORT_NOT_CONFIGURED\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi
            if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
              printf '%s\t%s\t%s\t%s\t%s\tINVALID_PORT_CONFIG\n' "$hostname" "$ip" "$os" "$online" "$port" >> device-artifacts/device-results.tsv
              continue
            fi

            ports=("$port")
            if [ "$hostname" = "Xiaomi 11i" ] && [ "$port" != "37337" ]; then ports+=("37337"); fi
            result="ADB_UNAVAILABLE_OR_UNPAIRED"
            serial=""
            for candidate_port in "${ports[@]}"; do
              candidate="$ip:$candidate_port"
              for attempt in 1 2 3; do
                echo "ADB connect attempt $attempt/3 for $hostname ($candidate)"
                timeout 12s adb connect "$candidate" > "device-artifacts/${hostname}-adb-connect.txt" 2>&1 || true
                state=$(timeout 12s adb -s "$candidate" get-state 2>/dev/null || true)
                if [ "$state" = "device" ]; then
                  serial="$candidate"
                  port="$candidate_port"
                  result="ADB_READY"
                  break 2
                fi
                timeout 5s tailscale ping --timeout=4s "$ip" >> "device-artifacts/${hostname}-tailscale-ping.txt" 2>&1 || true
                timeout 8s adb disconnect "$candidate" >/dev/null 2>&1 || true
                sleep $((attempt * 2))
              done
            done

            if [ "$result" = "ADB_READY" ]; then
              adb_device() { timeout 20s adb -s "$serial" "$@"; }
              # Wake the display after connection, not just before installation.
              adb_device shell input keyevent 224 >/dev/null 2>&1 || true
              adb_device shell wm dismiss-keyguard >/dev/null 2>&1 || true
              adb_device shell svc power stayon true >/dev/null 2>&1 || true
              adb_device shell input keyevent 82 >/dev/null 2>&1 || true
              sleep 2

              install_log="device-artifacts/${hostname}-install.txt"
              if timeout 120s adb -s "$serial" install -r -d -g dist/app-release.apk > "$install_log" 2>&1; then
                result="INSTALLED"
              else
                timeout 120s adb -s "$serial" install --no-streaming -r -d -g dist/app-release.apk >> "$install_log" 2>&1 && result="INSTALLED" || true
              fi

              if [ "$result" != "INSTALLED" ] && grep -q "INSTALL_FAILED_UPDATE_INCOMPATIBLE" "$install_log" 2>/dev/null; then
                result="SIGNATURE_MISMATCH_PRESERVED_DATA"
              elif [ "$result" = "INSTALLED" ]; then
                adb_device shell am force-stop com.badgym.designlab >/dev/null 2>&1 || true
                launch_log="device-artifacts/${hostname}-launch.txt"
                if timeout 20s adb -s "$serial" shell monkey -p com.badgym.designlab 1 > "$launch_log" 2>&1; then
                  # Wake again after launching; wait for Flutter's first frame.
                  adb_device shell input keyevent 224 >/dev/null 2>&1 || true
                  adb_device shell wm dismiss-keyguard >/dev/null 2>&1 || true
                  sleep 10
                  capture_dir="device-artifacts/ui-${hostname// /-}"
                  mkdir -p "$capture_dir"
                  timeout 25s adb -s "$serial" exec-out screencap -p > "$capture_dir/00-app-launch.png" 2> "$capture_dir/screencap-error.txt"
                  shot_rc=$?
                  timeout 20s adb -s "$serial" shell dumpsys activity activities > "$capture_dir/activity-state.txt" 2>&1 || true
                  timeout 20s adb -s "$serial" shell dumpsys power > "$capture_dir/power-state.txt" 2>&1 || true
                  timeout 25s adb -s "$serial" shell uiautomator dump /sdcard/badgym-window.xml >/dev/null 2>&1 || true
                  timeout 20s adb -s "$serial" pull /sdcard/badgym-window.xml "$capture_dir/window.xml" >/dev/null 2>&1 || true
                  timeout 20s adb -s "$serial" logcat -d -t 3000 > "device-artifacts/${hostname}-logcat.txt" 2>&1 || true

                  if [ "$shot_rc" -eq 0 ] && [ -s "$capture_dir/00-app-launch.png" ]; then
                    result="SCREENSHOT_CAPTURED"
                    # Capture rail destinations without scrolling the screen.
                    # These are evidence captures only; never fail the fleet job
                    # because an optional tap or follow-up screenshot is flaky.
                    screen_size=$(adb_device shell wm size 2>/dev/null | awk -F': ' '/Physical size/ {print $2}' | tail -n 1 | tr -d '\r')
                    screen_w=${screen_size%x*}; screen_h=${screen_size#*x}
                    interaction_failed=0
                    if [[ "$screen_w" =~ ^[0-9]+$ && "$screen_h" =~ ^[0-9]+$ ]]; then
                      tap_capture() {
                        local xr="$1" yr="$2" name="$3" expected="$4"
                        local x=$((screen_w * xr / 100)) y=$((screen_h * yr / 100))
                        adb_device shell input tap "$x" "$y" >/dev/null 2>&1 || { interaction_failed=1; return 0; }
                        sleep 2
                        adb_device shell uiautomator dump /sdcard/badgym-window.xml >/dev/null 2>&1 || true
                        adb_device pull /sdcard/badgym-window.xml "$capture_dir/$name.xml" >/dev/null 2>&1 || true
                        if [ ! -s "$capture_dir/$name.xml" ] || ! grep -Fq "$expected" "$capture_dir/$name.xml"; then
                          echo "::error::UI interaction verification failed for $name; expected visible text: $expected"
                          interaction_failed=1
                        fi
                        adb_device exec-out screencap -p > "$capture_dir/$name.png" 2>/dev/null || true
                      }
                      # Quick workspace tabs: the previous script tapped the left rail
                      # at these coordinates and mislabeled rail screenshots as tabs.
                      tap_capture 14 47 "01-attendance-dashboard" "Attendance Intelligence"
                      tap_capture 38 47 "02-workout-overview" "Workout Intelligence"
                      tap_capture 61 47 "03-payment-overview" "Payment Intelligence"
                      tap_capture 85 47 "04-body-overview" "Body Intelligence"
                      # Return to Attendance and verify every contextual rail destination.
                      tap_capture 14 47 "05-attendance-default" "Attendance Intelligence"
                      tap_capture 8 58 "06-attendance-intelligence" "Attendance Intelligence"
                      tap_capture 8 64 "07-attendance-calendar" "Attendance Intelligence"
                      tap_capture 8 70 "08-attendance-history" "Recent attendance records"
                      tap_capture 8 77 "09-attendance-trend" "Attendance trend"
                      tap_capture 8 84 "10-attendance-goals" "Monthly consistency goal"
                      tap_capture 8 90 "11-attendance-more" "Member attendance insights"
                    fi
                    if grep -q "mResumedActivity.*com.badgym.designlab\|topResumedActivity.*com.badgym.designlab" "$capture_dir/activity-state.txt"; then
                      if [ "$interaction_failed" -eq 0 ]; then
                        result="PASS"
                        tested=$((tested + 1))
                      else
                        result="INTERACTION_QA_FAILED"
                      fi
                    else
                      result="LAUNCH_STATE_UNCONFIRMED"
                    fi
                  else
                    result="SCREENSHOT_FAILED"
                  fi
                else
                  result="LAUNCH_FAILED"
                  timeout 20s adb -s "$serial" logcat -d -t 2000 > "device-artifacts/${hostname}-logcat.txt" 2>&1 || true
                fi
              fi
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$hostname" "$ip" "$os" "$online" "$port" "$result" >> device-artifacts/device-results.tsv
            timeout 8s adb disconnect "$serial" >/dev/null 2>&1 || true
          done < device-artifacts/tailnet-inventory.tsv

          cat device-artifacts/device-results.tsv
          echo "Successfully tested Android devices: $tested" | tee device-artifacts/summary.txt
          if [ "$tested" -eq 0 ]; then
            echo "::warning::No Android device completed app-launch and screenshot QA. Inspect per-device evidence."
          fi
      - name: Upload fleet QA inventory and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailnet-multi-device-qa-${{ github.sha }}
          path: device-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail clearly when no Android device passed QA
        if: always() && steps.check_keys.outputs.configured == 'true'
        shell: bash
        run: |
          if [ ! -f device-artifacts/device-results.tsv ]; then
            echo "::error::Device QA did not produce a result inventory."
            exit 1
          fi
          if ! awk -F '\t' 'NR > 1 && $6 == "PASS" { passed = 1 } END { exit !passed }' device-artifacts/device-results.tsv; then
            echo "::error::No configured Android device completed install, launch, and screenshot QA. Review the uploaded device artifacts."
            exit 1
          fi
          echo "At least one Android device passed install, launch, and screenshot QA."
      - name: Commit Live Screenshot to Repo (for AI Agent & User)
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chatgpt/design-lab-yellow-festive' || github.ref == 'refs/heads/chatgpt/ui-ux-remediation')
        continue-on-error: true
        run: |
          mkdir -p docs/screenshots
          shopt -s nullglob
          SCREENSHOTS=(device-artifacts/ui-Xiaomi-11i/01-attendance-calendar.png device-artifacts/ui-Xiaomi-11i/00-app-launch.png)
          if [ ${#SCREENSHOTS[@]} -gt 0 ]; then
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              DEST="docs/screenshots/bad_gym_live.png"
            else
              DEST="docs/screenshots/member-intelligence-live.png"
            fi
            cp "${SCREENSHOTS[0]}" "$DEST"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            if ! git diff --staged --quiet; then
              git commit -m "chore(qa): refresh live member intelligence screenshot [skip ci]"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

