name: Android Cloud Build & Multi-Device QA

on:
  push:
    branches: [main, setup/flutter-member-intelligence]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - ".github/workflows/android-cloud-device.yml"
  pull_request:
    branches: [main, setup/flutter-member-intelligence]
  workflow_dispatch:
    inputs:
      run_device_test:
        description: "Discover Tailnet devices and test every online, configured Android device"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Flutter checks + Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Bootstrap missing Gradle Wrapper files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p "$RUNNER_TEMP/gradle-wrapper-bootstrap"
            cd "$RUNNER_TEMP/gradle-wrapper-bootstrap"
            gradle wrapper --gradle-version 9.3.1
            mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
            cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
            cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
            chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          fi
          test -x "$GITHUB_WORKSPACE/android/gradlew"
          test -f "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          cd android && ./gradlew --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart formatting report
        run: dart format --output=none lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  multi-device-qa:
    name: Tailnet discovery + Android fleet QA
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        name: Download release APK
        with:
          name: bad-gym-android-release-${{ github.sha }}
          path: dist
      - name: Install Android platform tools and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-tools jq
      - name: Restore paired ADB host identity
        env:
          ADB_PRIVATE_KEY_B64: ${{ secrets.DEVICE_ADB_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$ADB_PRIVATE_KEY_B64" ]; then
            echo "::error::Missing DEVICE_ADB_PRIVATE_KEY_B64 repository secret."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ADB_PRIVATE_KEY_B64" | base64 --decode > "$HOME/.android/adbkey"
          chmod 600 "$HOME/.android/adbkey"
      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Discover Tailnet and test all online configured Android devices
        env:
          ANDROID_DEVICE_PORTS_JSON: ${{ secrets.ANDROID_DEVICE_PORTS_JSON }}
        run: |
          set -euo pipefail
          mkdir -p device-artifacts
          adb start-server

          if [ -z "$ANDROID_DEVICE_PORTS_JSON" ]; then
            echo "::error::Missing ANDROID_DEVICE_PORTS_JSON. Map each Android hostname to its ADB TCP port."
            exit 1
          fi
          printf '%s' "$ANDROID_DEVICE_PORTS_JSON" | jq -e 'type == "object"' >/dev/null

          tailscale status --json > device-artifacts/tailnet-status.json
          jq -r '
            .Peer // {} | to_entries[] |
            [.value.HostName, (.value.TailscaleIPs[0] // ""), (.value.OS // "unknown"), (.value.Online // false)] |
            @tsv
          ' device-artifacts/tailnet-status.json > device-artifacts/tailnet-inventory.tsv

          printf 'hostname\tip\tos\tonline\tadb_port\tresult\n' > device-artifacts/device-results.tsv
          tested=0

          while IFS=$'\t' read -r hostname ip os online; do
            [ -n "$hostname" ] || continue
            case "$ip" in *:*) continue ;; esac
            if [ "$online" != "true" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tOFFLINE_SKIPPED\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi

            # Inventory every peer, but APK/ADB tests are Android-only.
            if [ "$os" != "android" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tINVENTORY_ONLY\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi

            port=$(printf '%s' "$ANDROID_DEVICE_PORTS_JSON" | jq -r --arg host "$hostname" '.[$host] // empty')
            if [ -z "$port" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tADB_PORT_NOT_CONFIGURED\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi
            if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
              printf '%s\t%s\t%s\t%s\t%s\tINVALID_PORT_CONFIG\n' "$hostname" "$ip" "$os" "$online" "$port" >> device-artifacts/device-results.tsv
              continue
            fi

            serial="$ip:$port"
            result="FAILED"
            if adb connect "$serial" >/dev/null 2>&1; then
              for attempt in $(seq 1 6); do
                if adb -s "$serial" get-state 2>/dev/null | grep -q device; then
                  result="ADB_READY"
                  break
                fi
                sleep 5
              done
            fi

            if [ "$result" = "ADB_READY" ]; then
              if adb -s "$serial" install -r dist/app-release.apk > "device-artifacts/${hostname}-install.txt" 2>&1 &&
                 adb -s "$serial" shell am force-stop com.badgym.bad_gym &&
                 adb -s "$serial" shell monkey -p com.badgym.bad_gym 1 > "device-artifacts/${hostname}-launch.txt" 2>&1; then
                sleep 8
                adb -s "$serial" exec-out screencap -p > "device-artifacts/${hostname}-screenshot.png"
                adb -s "$serial" logcat -d -t 3000 > "device-artifacts/${hostname}-logcat.txt"
                result="PASS"
                tested=$((tested + 1))
              else
                result="INSTALL_OR_LAUNCH_FAILED"
                adb -s "$serial" logcat -d -t 3000 > "device-artifacts/${hostname}-logcat.txt" || true
              fi
            else
              result="ADB_UNAVAILABLE_OR_UNPAIRED"
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$hostname" "$ip" "$os" "$online" "$port" "$result" >> device-artifacts/device-results.tsv
          done < device-artifacts/tailnet-inventory.tsv

          cat device-artifacts/device-results.tsv
          echo "Successfully tested Android devices: $tested" | tee device-artifacts/summary.txt
          if [ "$tested" -eq 0 ]; then
            echo "::warning::No Android device completed QA. Check device online state, ADB pairing, ports, and Tailscale ACLs."
          fi
      - name: Upload fleet QA inventory and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailnet-multi-device-qa-${{ github.sha }}
          path: device-artifacts/
          if-no-files-found: warn
          retention-days: 14
