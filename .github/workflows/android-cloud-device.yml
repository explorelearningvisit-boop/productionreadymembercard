name: Android Cloud Build & Multi-Device QA

on:
  push:
    branches: [main, setup/flutter-member-intelligence, chatgpt/design-lab-yellow-festive]
    paths:
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - ".github/workflows/android-cloud-device.yml"
  pull_request:
    branches: [main, setup/flutter-member-intelligence]
  workflow_dispatch:
    inputs:
      run_device_test:
        description: "Discover Tailnet devices and test every online, configured Android device"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Flutter checks + Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Debounce rapid commits
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "Waiting 30 seconds for a batch of rapid AI commits to finish..."
          sleep 30
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Keep the CI debug signing identity stable between ephemeral runners.
      # This is a QA/debug key only; production release signing must use a protected keystore.
      - name: Restore stable CI debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: badgym-ci-debug-keystore-v1
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          missing=()
          [ -d "$ANDROID_HOME/platform-tools" ] || missing+=("platform-tools")
          [ -d "$ANDROID_HOME/platforms/android-36" ] || missing+=("platforms;android-36")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || missing+=("build-tools;36.0.0")
          if [ "${#missing[@]}" -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install "${missing[@]}"
          else
            echo "Android SDK packages already present; skipping sdkmanager."
          fi
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Gradle Wrapper permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          test -x "$GITHUB_WORKSPACE/android/gradlew"
          test -f "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          cd android && ./gradlew --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart formatting report
        run: dart format --output=none lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  multi-device-qa:
    name: Tailnet discovery + Android fleet QA
    needs: build-and-test
    if: (github.event_name == 'workflow_dispatch' && inputs.run_device_test == true) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chatgpt/design-lab-yellow-festive'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        name: Download release APK
        with:
          name: bad-gym-android-release-${{ github.sha }}
          path: dist
      - name: Ensure Android platform tools and jq
        shell: bash
        run: |
          missing=()
          command -v adb >/dev/null 2>&1 || missing+=(android-sdk-platform-tools)
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get install -y "${missing[@]}"
          else
            echo "adb and jq already available; skipping package installation."
          fi
      - name: Restore paired ADB host identity
        id: check_keys
        env:
          ADB_KEY: ${{ secrets.DEVICE_ADB_PRIVATE_KEY_B64 }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$ADB_KEY" ] || ([ -z "$TS_ID" ] && [ -z "$TS_KEY" ]); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "use_oauth=false" >> "$GITHUB_OUTPUT"
            echo "use_authkey=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tailscale or ADB keys not set in repository secrets. Skipping live device testing."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            if [ -n "$TS_ID" ] && [ -n "${{ secrets.TS_AUDIENCE }}" ]; then
              echo "use_oauth=true" >> "$GITHUB_OUTPUT"
              echo "use_authkey=false" >> "$GITHUB_OUTPUT"
            elif [ -n "$TS_KEY" ]; then
              echo "use_oauth=false" >> "$GITHUB_OUTPUT"
              echo "use_authkey=true" >> "$GITHUB_OUTPUT"
            else
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "use_oauth=false" >> "$GITHUB_OUTPUT"
              echo "use_authkey=false" >> "$GITHUB_OUTPUT"
              echo "::error::OAuth client ID requires TS_AUDIENCE, or configure TAILSCALE_AUTHKEY."
              exit 1
            fi
            mkdir -p "$HOME/.android"
            printf '%s' "$ADB_KEY" | base64 --decode > "$HOME/.android/adbkey"
            chmod 600 "$HOME/.android/adbkey"
          fi
      - name: Join Tailscale (OAuth)
        if: steps.check_keys.outputs.configured == 'true' && steps.check_keys.outputs.use_oauth == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          timeout: 3m
          retry: 8
          use-cache: true
      - name: Join Tailscale (Auth Key)
        if: steps.check_keys.outputs.configured == 'true' && steps.check_keys.outputs.use_authkey == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          timeout: 3m
          retry: 8
          use-cache: true
      - name: Discover Tailnet and test all online configured Android devices
        if: steps.check_keys.outputs.configured == 'true'
        env:
          ANDROID_DEVICE_PORTS_JSON: ${{ secrets.ANDROID_DEVICE_PORTS_JSON }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p device-artifacts
          adb start-server

          if [ -z "$ANDROID_DEVICE_PORTS_JSON" ]; then
            echo "::error::Missing ANDROID_DEVICE_PORTS_JSON."
            exit 1
          fi
          printf '%s' "$ANDROID_DEVICE_PORTS_JSON" | jq -e 'type == "object"' >/dev/null

          # Confirm the tunnel is healthy once, then reuse it for every peer.
          tailscale status --json > device-artifacts/tailnet-status.json
          tailscale netcheck > device-artifacts/tailscale-netcheck.txt 2>&1 || true
          jq -r '
            .Peer // {} | to_entries[] |
            [.value.HostName, (.value.TailscaleIPs[0] // ""), (.value.OS // "unknown"), (.value.Online // false)] |
            @tsv
          ' device-artifacts/tailnet-status.json > device-artifacts/tailnet-inventory.tsv

          printf 'hostname\tip\tos\tonline\tadb_port\tresult\n' > device-artifacts/device-results.tsv
          tested=0
          while IFS=$'\t' read -r hostname ip os online; do
            [ -n "$hostname" ] || continue
            case "$ip" in *:*) continue ;; esac
            if [ "$online" != "true" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tOFFLINE_SKIPPED\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi
            if [ "$os" != "android" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tINVENTORY_ONLY\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi

            port=$(jq -r --arg host "$hostname" --arg ip "$ip" '.[$host] // .[$ip] // empty' <<< "$ANDROID_DEVICE_PORTS_JSON")
            if [ -z "$port" ]; then
              printf '%s\t%s\t%s\t%s\t%s\tADB_PORT_NOT_CONFIGURED\n' "$hostname" "$ip" "$os" "$online" "-" >> device-artifacts/device-results.tsv
              continue
            fi
            if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
              printf '%s\t%s\t%s\t%s\t%s\tINVALID_PORT_CONFIG\n' "$hostname" "$ip" "$os" "$online" "$port" >> device-artifacts/device-results.tsv
              continue
            fi

            # The configured port is the current preferred endpoint. 37337 is a
            # previously user-reported Xiaomi Wireless Debugging connect port;
            # try it only as a bounded fallback, never as proof that the port is current.
            ports=("$port")
            if [ "$hostname" = "Xiaomi 11i" ] && [ "$port" != "37337" ]; then
              ports+=("37337")
            fi
            result="ADB_UNAVAILABLE_OR_UNPAIRED"
            for candidate_port in "${ports[@]}"; do
              serial="$ip:$candidate_port"
              # Wireless debugging ports can change; retry only known endpoints.
              for attempt in 1 2 3; do
                echo "ADB connect attempt $attempt/3 for $hostname ($serial)"
                tailscale ping --timeout=5s "$ip" > "device-artifacts/${hostname}-tailscale-ping.txt" 2>&1 || true
                adb connect "$serial" > "device-artifacts/${hostname}-adb-connect.txt" 2>&1 || true
                state=$(adb -s "$serial" get-state 2>/dev/null || true)
                if [ "$state" = "device" ]; then
                  result="ADB_READY"
                  port="$candidate_port"
                  break 2
                fi
                adb disconnect "$serial" >/dev/null 2>&1 || true
                sleep $((attempt * 2))
              done
            done

            if [ "$result" = "ADB_READY" ]; then
              adb -s "$serial" shell input keyevent 224 >/dev/null 2>&1 || true
              adb -s "$serial" shell wm dismiss-keyguard >/dev/null 2>&1 || true

              install_log="device-artifacts/${hostname}-install.txt"
              # In-place overwrite preserving user data and auto-granting permissions (-r -d -g)
              if adb -s "$serial" install -r -d -g dist/app-release.apk > "$install_log" 2>&1; then
                result="INSTALLED"
              else
                # Retry with non-streaming if needed
                adb -s "$serial" install --no-streaming -r -d -g dist/app-release.apk >> "$install_log" 2>&1 && result="INSTALLED" || true
              fi

              # Preserve the user's installed app and data on signature mismatch.
              # A clean migration is a user decision; CI must never uninstall automatically.
              if [ "$result" != "INSTALLED" ] && grep -q "INSTALL_FAILED_UPDATE_INCOMPATIBLE" "$install_log"; then
                result="SIGNATURE_MISMATCH_PRESERVED_DATA"
                echo "::warning::APK signature differs from installed app. Existing app/data were preserved; perform an explicitly approved migration outside CI."
              fi

              if [ "$result" = "INSTALLED" ]; then
                # Bring to home screen to close any open keyboard or foreground apps
                adb -s "$serial" shell input keyevent 3 >/dev/null 2>&1 || true
                sleep 1
                adb -s "$serial" shell am force-stop com.badgym.designlab >/dev/null 2>&1 || true
                if adb -s "$serial" shell monkey -p com.badgym.designlab 1 > "device-artifacts/${hostname}-launch.txt" 2>&1; then
                  sleep 6
                  capture_dir="device-artifacts/ui-${hostname// /-}"
                  mkdir -p "$capture_dir"
                  adb -s "$serial" exec-out screencap -p > "device-artifacts/${hostname}-screenshot.png" || result="SCREENSHOT_FAILED"

                  # Capture the actual device UI through the already-paired ADB-over-Tailscale link.
                  # Screenshots are uploaded as a timestamped GitHub Actions artifact.
                  screen_size=$(adb -s "$serial" shell wm size | awk -F': ' '/Physical size/ {print $2}' | tail -n 1 | tr -d '\r')
                  screen_w=${screen_size%x*}
                  screen_h=${screen_size#*x}
                  if [[ "$screen_w" =~ ^[0-9]+$ && "$screen_h" =~ ^[0-9]+$ ]]; then
                    tap_ratio() {
                      local xr="$1" yr="$2" name="$3"
                      local x=$((screen_w * xr / 100))
                      local y=$((screen_h * yr / 100))
                      adb -s "$serial" shell input tap "$x" "$y"
                      sleep 1
                      adb -s "$serial" exec-out screencap -p > "$capture_dir/$name.png"
                      printf '%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$name" "$x,$y" >> "$capture_dir/capture-index.tsv"
                    }

                    # Reset the scroll position and capture the member hero/header.
                    for _ in 1 2 3; do
                      adb -s "$serial" shell input swipe "$((screen_w / 2))" "$((screen_h * 28 / 100))" "$((screen_w / 2))" "$((screen_h * 78 / 100))" 320
                    done
                    sleep 1
                    adb -s "$serial" exec-out screencap -p > "$capture_dir/00-member-header.png"
                    tap_ratio 12 66 "00a-horizontal-attendance"
                    tap_ratio 37 66 "00b-horizontal-workout"
                    tap_ratio 62 66 "00c-horizontal-payment"
                    tap_ratio 87 66 "00d-horizontal-body"

                    # Move to the intelligence workspace, then inspect every primary rail destination.
                    for _ in 1 2 3; do
                      adb -s "$serial" shell input swipe "$((screen_w / 2))" "$((screen_h * 78 / 100))" "$((screen_w / 2))" "$((screen_h * 32 / 100))" 320
                    done
                    sleep 1
                    adb -s "$serial" exec-out screencap -p > "$capture_dir/01-dashboard-workspace.png"
                    tap_ratio 13 39 "02-dashboard"
                    tap_ratio 13 47 "03-attendance"
                    tap_ratio 13 55 "04-workout"
                    tap_ratio 13 63 "05-payments"
                    tap_ratio 13 71 "06-offers"
                    tap_ratio 13 79 "07-history"
                    tap_ratio 13 87 "08-body"

                    # Attendance submenu states: Overview, Calendar, Trends, Streak.
                    tap_ratio 13 47 "09-attendance-overview"
                    tap_ratio 51 43 "10-attendance-calendar"
                    tap_ratio 68 43 "11-attendance-trends"
                    tap_ratio 82 43 "12-attendance-streak"
                    # Verify vertical scrolling is responsive and capture the lower content.
                    adb -s "$serial" shell input swipe "$((screen_w / 2))" "$((screen_h * 78 / 100))" "$((screen_w / 2))" "$((screen_h * 38 / 100))" 350
                    sleep 1
                    adb -s "$serial" exec-out screencap -p > "$capture_dir/13-attendance-scroll.png"
                  else
                    echo "::warning::Unable to parse Android display size; retained the initial device screenshot only."
                  fi

                  adb -s "$serial" logcat -d -t 3000 > "device-artifacts/${hostname}-logcat.txt" || true
                  [ "$result" != "SCREENSHOT_FAILED" ] && result="PASS"
                  tested=$((tested + 1))
                else
                  result="LAUNCH_FAILED"
                  adb -s "$serial" logcat -d -t 2000 > "device-artifacts/${hostname}-logcat.txt" || true
                fi
              elif grep -q "INSTALL_FAILED_USER_RESTRICTED" "$install_log"; then
                result="MIUI_INSTALL_PERMISSION_REQUIRED"
                echo "::warning::MIUI blocked ADB install. Enable Developer options > Install via USB on device."
                adb -s "$serial" logcat -d -t 1000 > "device-artifacts/${hostname}-logcat.txt" || true
              else
                result="INSTALL_FAILED"
                adb -s "$serial" logcat -d -t 1000 > "device-artifacts/${hostname}-logcat.txt" || true
              fi
            fi

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$hostname" "$ip" "$os" "$online" "$port" "$result" >> device-artifacts/device-results.tsv
          done < device-artifacts/tailnet-inventory.tsv

          cat device-artifacts/device-results.tsv
          echo "Successfully tested Android devices: $tested" | tee device-artifacts/summary.txt
          if [ "$tested" -eq 0 ]; then
            echo "::warning::No Android device completed QA. Inspect per-device status and logs."
          fi
      - name: Upload fleet QA inventory and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailnet-multi-device-qa-${{ github.sha }}
          path: device-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail clearly when no Android device passed QA
        if: always() && steps.check_keys.outputs.configured == 'true'
        shell: bash
        run: |
          if [ ! -f device-artifacts/device-results.tsv ]; then
            echo "::error::Device QA did not produce a result inventory."
            exit 1
          fi
          if ! awk -F '\t' 'NR > 1 && $6 == "PASS" { passed = 1 } END { exit !passed }' device-artifacts/device-results.tsv; then
            echo "::error::No configured Android device completed install, launch, and screenshot QA. Review the uploaded device artifacts."
            exit 1
          fi
          echo "At least one Android device passed install, launch, and screenshot QA."
      - name: Commit Live Screenshot to Repo (for AI Agent & User)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p docs/screenshots
          shopt -s nullglob
          SCREENSHOTS=(device-artifacts/*-screenshot.png)
          if [ ${#SCREENSHOTS[@]} -gt 0 ]; then
            cp "${SCREENSHOTS[0]}" docs/screenshots/bad_gym_live.png
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/screenshots/bad_gym_live.png
            if ! git diff --staged --quiet; then
              git commit -m "chore(qa): auto-capture live screenshot from device [skip ci]"
              git push origin main
            fi
          fi

