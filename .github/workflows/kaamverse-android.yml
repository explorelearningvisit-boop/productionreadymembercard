name: KaamVerse Android CI

on:
  push:
    branches:
      - rebuild/kaamverse-platform
    paths:
      - "apps/arjun_flutter/**"
      - ".github/workflows/kaamverse-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/arjun_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name arjun_app .
      - name: Resolve packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze
      - name: Widget and unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaamverse-android-apks
          path: |
            apps/arjun_flutter/build/app/outputs/flutter-apk/app-debug.apk
            apps/arjun_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
