name: Cloud Build, Deploy & Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Cloud Gradle Build & APK Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Gradle Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradlew Execution Permission
        run: chmod +x android/gradlew

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Format Check
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  deploy-to-physical-device:
    name: Over-The-Air Install & Live Screenshot (Tailscale)
    needs: build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: bad-gym-debug-apk
          path: build-artifacts

      - name: Connect to Tailscale
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v2
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install Android ADB CLI
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y android-tools-adb

      - name: Install APK & Capture Physical Device Screenshot
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        continue-on-error: true
        run: |
          echo "Connecting to Xiaomi 11i 5G via Tailscale..."
          adb connect 100.123.18.54:5555
          sleep 2
          
          # Wake up screen and unlock
          adb -s 100.123.18.54:5555 shell input keyevent 224 || true
          adb -s 100.123.18.54:5555 shell wm dismiss-keyguard || true
          
          # Install APK directly on phone
          echo "Installing latest APK on phone..."
          adb -s 100.123.18.54:5555 install -r build-artifacts/app-debug.apk
          
          # Launch app
          echo "Starting app..."
          adb -s 100.123.18.54:5555 shell am start -n com.badgym.bad_gym/.MainActivity
          sleep 6
          
          # Take screencap and pull to repo
          echo "Capturing live screenshot..."
          mkdir -p docs/screenshots
          adb -s 100.123.18.54:5555 shell screencap -p /sdcard/bad_gym_live.png
          adb -s 100.123.18.54:5555 pull /sdcard/bad_gym_live.png docs/screenshots/bad_gym_live.png
          echo "Live screenshot saved successfully!"

      - name: Upload Live Physical Device Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-physical-device-screenshot
          path: docs/screenshots/bad_gym_live.png
          if-no-files-found: warn

      - name: Auto-Commit Live Screenshot for ChatGPT & GitHub
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/bad_gym_live.png
          if ! git diff --staged --quiet; then
            git commit -m "chore(qa): auto-capture live screenshot from Xiaomi device [skip ci]"
            git push origin main
          else
            echo "No screenshot update to commit."
          fi

  cloud-emulator-preview:
    name: Cloud Android Emulator Preview (Headless Fallback)
    needs: build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: bad-gym-debug-apk
          path: bad-gym-debug-apk

      - name: Run Emulator & Capture UI Preview
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p artifacts/screenshots
            adb install bad-gym-debug-apk/app-debug.apk
            adb shell am start -n com.badgym.bad_gym/.MainActivity
            sleep 5
            adb exec-out screencap -p > artifacts/screenshots/cloud_emulator_preview.png

      - name: Upload Cloud Emulator Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: cloud-emulator-preview
          path: artifacts/screenshots/cloud_emulator_preview.png
          if-no-files-found: error
