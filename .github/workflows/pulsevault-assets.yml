name: BAD GYM Generate PulseVault Assets

on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
    paths:
      - 'tools/build_pulsevault_emerald_derivatives.py'
      - 'assets/material_pack/inbox/PulseVault/*.webp'
      - 'assets/material_pack/inbox/PulseVault/*.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bad-gym-pulsevault-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "opencv-python-headless==4.10.0.84"

      - name: Generate optimized transparent assets
        run: |
          python tools/build_pulsevault_emerald_derivatives.py \
            --root assets/material_pack/inbox/PulseVault \
            --out assets/material_pack/inbox/PulseVault/optimized

      - name: Verify real alpha and crop safety
        run: |
          python tools/audit_pulsevault_assets.py \
            --root assets/material_pack/inbox/PulseVault/optimized \
            --manifest assets/material_pack/inbox/PulseVault/optimized/manifest.json \
            --json-out pulsevault-optimized-audit.json \
            --markdown-out pulsevault-optimized-audit.md

      - name: Upload optimized artwork and audit
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-pulsevault-optimized-source
          path: |
            assets/material_pack/inbox/PulseVault/optimized/
            pulsevault-optimized-audit.json
            pulsevault-optimized-audit.md
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated binary assets to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/material_pack/inbox/PulseVault/optimized/
          if git diff --cached --quiet; then
            echo "Optimized artwork already matches generated assets."
            exit 0
          fi
          git commit -m "Add verified Emerald Pearl PulseVault cut-outs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
