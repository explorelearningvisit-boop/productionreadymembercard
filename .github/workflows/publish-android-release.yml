name: Publish Signed BAD GYM Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: badgym-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Require protected release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.BADGYM_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BADGYM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BADGYM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BADGYM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Protected release signing secret $name is missing. No public release will be produced."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/signing/badgym-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/badgym-release.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore release signing environment
        env:
          STORE_PASSWORD: ${{ secrets.BADGYM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BADGYM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BADGYM_RELEASE_KEY_PASSWORD }}
        run: |
          echo "BADGYM_RELEASE_STORE_FILE=$RUNNER_TEMP/signing/badgym-release.jks" >> "$GITHUB_ENV"
          echo "BADGYM_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BADGYM_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BADGYM_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Resolve and test
        run: |
          flutter pub get
          dart format --output=none lib test
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Build signed APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Verify APK signature and calculate digest
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" bad-gym-android.apk
      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BAD GYM ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bad-gym-android.apk
            SHA256SUMS.txt
