name: ARJUN Flutter Android Build and Tailscale QA

on:
  push:
    branches: [feature/arjun-flutter-marketplace]
    paths:
      - "apps/arjun_flutter/**"
      - ".github/workflows/arjun-flutter-android.yml"
  pull_request:
    branches: [feature/arjun-flutter-marketplace]
  workflow_dispatch:
    inputs:
      deploy_to_phone:
        description: "Attempt install on the configured, ADB-authorized Android phone"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arjun-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/arjun_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --org in.arjun --project-name arjun_app .
      - name: Dependencies and quality checks
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded
      - name: Build Android QA APK (release mode, unsigned)
        run: flutter build apk --release
      - name: Build one-tap demo APK (debug only)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: arjun-android-demo-debug-${{ github.sha }}
          path: apps/arjun_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: arjun-android-qa-${{ github.sha }}
          path: apps/arjun_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/arjun_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform project
        run: flutter create --platforms=ios --org in.arjun --project-name arjun_app .
      - name: Build unsigned iOS app for simulator validation
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign --release

  phone-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_phone == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arjun-android-demo-debug-${{ github.sha }}
          path: dist
      - name: Join Tailnet using GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          timeout: 3m
      - name: Restore paired ADB identity
        env:
          ADB_KEY: ${{ secrets.DEVICE_ADB_PRIVATE_KEY_B64 }}
        run: |
          test -n "$ADB_KEY" || { echo "Missing paired ADB host key secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ADB_KEY" | base64 --decode > "$HOME/.android/adbkey"
          chmod 600 "$HOME/.android/adbkey"
      - name: Connect and install on configured phone
        env:
          DEVICE_IP: ${{ secrets.DEVICE_TAILSCALE_IP }}
          DEVICE_PORTS_JSON: ${{ secrets.ANDROID_DEVICE_PORTS_JSON }}
        run: |
          set -euo pipefail
          test -n "$DEVICE_PORTS_JSON" || { echo "Missing ANDROID_DEVICE_PORTS_JSON"; exit 1; }
          adb start-server
          tailscale ping --timeout=10s "$DEVICE_IP"
          tailscale status --json > tailnet-status.json
          HOST=$(jq -r --arg ip "$DEVICE_IP" '.Peer // {} | to_entries[] | select((.value.TailscaleIPs // []) | index($ip)) | .value.HostName' tailnet-status.json | head -n1)
          PORT=$(jq -r --arg host "$HOST" --arg ip "$DEVICE_IP" '.[$host] // .[$ip] // empty' <<< "$DEVICE_PORTS_JSON")
          PORT=${PORT:-37337}
          echo "Target peer: $HOST at $DEVICE_IP:$PORT"
          adb connect "$DEVICE_IP:$PORT"
          adb -s "$DEVICE_IP:$PORT" get-state
          adb -s "$DEVICE_IP:$PORT" install -r dist/app-debug.apk
          adb -s "$DEVICE_IP:$PORT" shell monkey -p in.arjun.arjun_app 1
          sleep 5
          mkdir -p evidence
          adb -s "$DEVICE_IP:$PORT" exec-out screencap -p > evidence/arjun-phone.png
          adb -s "$DEVICE_IP:$PORT" logcat -d -t 1200 > evidence/arjun-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arjun-phone-qa-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
