name: ARJUN Flutter Android Build and Tailscale QA
on:
  push:
    branches: [feature/arjun-flutter-marketplace]
    paths: ["apps/arjun_flutter/**", ".github/workflows/arjun-flutter-android.yml"]
  pull_request:
    branches: [feature/arjun-flutter-marketplace]
  workflow_dispatch:
    inputs:
      deploy_to_phone:
        description: "Install on configured ADB-authorized Android phone"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: arjun-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/arjun_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Capture toolchain diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/arjun-diagnostics"
          flutter --version | tee "$RUNNER_TEMP/arjun-diagnostics/flutter-version.txt"
          flutter doctor -v 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/flutter-doctor.txt"
          java -version 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/java-version.txt"
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.arjun --project-name arjun_app .
      - name: Resolve dependencies with bounded network retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter pub get --verbose 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/pub-get-$attempt.log"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 8)); fi
          done
          exit 1
      - name: Format, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/format.log"
          flutter analyze --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/analyze.log"
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/test.log"
      - name: Build debug APK with verbose Gradle logs
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --verbose 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/android-debug-build.log"
      - name: Build release QA APK with verbose Gradle logs
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee "$RUNNER_TEMP/arjun-diagnostics/android-release-build.log"
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arjun-android-apks-${{ github.sha }}
          path: |
            apps/arjun_flutter/build/app/outputs/flutter-apk/app-debug.apk
            apps/arjun_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arjun-ci-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/arjun-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Explain failure evidence
        if: failure()
        run: |
          echo "## ARJUN CI failure" >> "$GITHUB_STEP_SUMMARY"
          echo "Full verbose Flutter, Gradle and dependency logs are in arjun-ci-diagnostics." >> "$GITHUB_STEP_SUMMARY"
          echo "CI captures diagnostics; it does not autonomously rewrite source code." >> "$GITHUB_STEP_SUMMARY"
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/arjun_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.arjun --project-name arjun_app .
      - name: Build unsigned simulator app
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign --verbose
  phone-qa:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_phone == true && vars.ARJUN_PHONE_QA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arjun-android-apks-${{ github.sha }}
          path: dist
      - name: Install Android platform tools and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-tools jq
      - name: Validate Tailscale and ADB configuration
        id: check_keys
        env:
          ADB_KEY: ${{ secrets.DEVICE_ADB_PRIVATE_KEY_B64 }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          DEVICE_IP: ${{ secrets.DEVICE_TAILSCALE_IP }}
          DEVICE_PORTS_JSON: ${{ secrets.ANDROID_DEVICE_PORTS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "$ADB_KEY" ] || missing+=("DEVICE_ADB_PRIVATE_KEY_B64")
          [ -n "$DEVICE_IP" ] || missing+=("DEVICE_TAILSCALE_IP")
          [ -n "$DEVICE_PORTS_JSON" ] || missing+=("ANDROID_DEVICE_PORTS_JSON")
          if [ -n "$TS_ID" ] && [ -n "$TS_AUDIENCE" ]; then echo "auth_mode=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "$TS_AUTHKEY" ]; then echo "auth_mode=authkey" >> "$GITHUB_OUTPUT"
          else missing+=("TS_OAUTH_CLIENT_ID + TS_AUDIENCE (or TAILSCALE_AUTHKEY)"); fi
          if [ "${{ missing[@] }}" != "" ]; then :; fi
          if [ "${{#missing[@]}}" -gt 0 ]; then printf '::error::Missing GitHub Actions secrets: %s\n' "$(IFS=', '; echo "${{missing[*]}}")"; exit 1; fi
          printf '%s' "$DEVICE_PORTS_JSON" | jq -e 'type == "object"' >/dev/null
          mkdir -p "$HOME/.android"
          printf '%s' "$ADB_KEY" | base64 --decode > "$HOME/.android/adbkey"
          chmod 600 "$HOME/.android/adbkey"
      - name: Join Tailnet with GitHub OIDC
        if: steps.check_keys.outputs.auth_mode == 'oauth'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          timeout: 3m
          retry: 8
          use-cache: true
      - name: Join Tailnet with auth key
        if: steps.check_keys.outputs.auth_mode == 'authkey'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
          timeout: 3m
          retry: 8
          use-cache: true
      - name: Install, launch and capture phone evidence
        env:
          DEVICE_IP: ${{ secrets.DEVICE_TAILSCALE_IP }}
          DEVICE_PORTS_JSON: ${{ secrets.ANDROID_DEVICE_PORTS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          adb start-server
          tailscale status --json > tailnet-status.json
          tailscale ping --timeout=10s "$DEVICE_IP"
          HOST=$(jq -r --arg ip "$DEVICE_IP" '.Peer // {} | to_entries[] | select((.value.TailscaleIPs // []) | index($ip)) | .value.HostName' tailnet-status.json | head -n1)
          PORT=$(jq -r --arg host "$HOST" --arg ip "$DEVICE_IP" '.[$host] // .[$ip] // empty' <<< "$DEVICE_PORTS_JSON")
          [[ "$PORT" =~ ^[0-9]+$ ]] || { echo "::error::Invalid Wireless debugging port"; exit 1; }
          SERIAL="$DEVICE_IP:$PORT"
          adb connect "$SERIAL"
          STATE=$(adb -s "$SERIAL" get-state 2>/dev/null || true)
          [ "$STATE" = "device" ] || { echo "::error::ADB not authorized; re-pair runner key on phone"; adb devices -l; exit 1; }
          adb -s "$SERIAL" install -r -d -g dist/app-debug.apk
          adb -s "$SERIAL" shell am force-stop com.arjun.arjun_app || true
          adb -s "$SERIAL" shell monkey -p com.arjun.arjun_app 1
          sleep 6
          mkdir -p evidence
          adb -s "$SERIAL" exec-out screencap -p > evidence/arjun-phone.png
          adb -s "$SERIAL" logcat -d -t 2000 > evidence/arjun-logcat.txt
          test -s evidence/arjun-phone.png
      - name: Upload phone QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arjun-phone-qa-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
