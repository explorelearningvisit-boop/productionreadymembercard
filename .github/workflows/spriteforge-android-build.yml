name: SpriteForge Android APK
on:
  push:
    branches: [feature/spriteforge-image-tools]
    paths:
      - 'spriteforge/**'
      - '.github/workflows/spriteforge-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spriteforge
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.spriteforge .
      - name: Configure consistent Android JVM targets
        run: |
          mkdir -p android/gradle
          cat > android/gradle/jvm-compat.gradle <<'GRADLE'
          // Align Android Java and Kotlin compilation at the Android extension level.
          // A single JVM target avoids plugin-specific Java 11 / Kotlin 17 conflicts.
          allprojects {
              plugins.withId('com.android.application') {
                  def androidExtension = extensions.findByName('android')
                  androidExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                  androidExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
              }
              plugins.withId('com.android.library') {
                  def androidExtension = extensions.findByName('android')
                  androidExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                  androidExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
              }
              plugins.withId('org.jetbrains.kotlin.android') {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          GRADLE
          printf '\n// Shared Android Java/Kotlin compatibility for all Flutter plugins.\napply(from = "gradle/jvm-compat.gradle")\n' >> android/build.gradle.kts
      - name: Add network permission for first-time ML Kit model download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = "    <application"
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace(marker, permission + marker, 1)
          manifest.write_text(content)
          PY
      - name: Download Real-ESRGAN TFLite model (MIT project; model credit in notices)
        run: |
          mkdir -p assets/models
          curl -L --fail --retry 3 --retry-delay 2 https://raw.githubusercontent.com/airesearch-official/GhostScale/main/assets/models/Real-ESRGAN-General-x4v3_float.tflite -o assets/models/Real-ESRGAN-General-x4v3_float.tflite
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spriteforge-release-apk-${{ github.sha }}
          path: spriteforge/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
