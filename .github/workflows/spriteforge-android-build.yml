name: SpriteForge Android APK
on:
  push:
    branches: [feature/spriteforge-image-tools]
    paths:
      - 'spriteforge/**'
      - '.github/workflows/spriteforge-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: spriteforge-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spriteforge
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.spriteforge .
      - name: Add network permission for first-time ML Kit model download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          marker = "    <application"
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if "android.permission.INTERNET" not in content:
              content = content.replace(marker, permission + marker, 1)
          manifest.write_text(content)
          PY
      - name: Download Real-ESRGAN TFLite model (MIT project; model credit in notices)
        run: |
          mkdir -p assets/models
          curl -L --fail --retry 3 --retry-delay 2 https://raw.githubusercontent.com/airesearch-official/GhostScale/main/assets/models/Real-ESRGAN-General-x4v3_float.tflite -o assets/models/Real-ESRGAN-General-x4v3_float.tflite
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spriteforge-release-apk-${{ github.sha }}
          path: spriteforge/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
