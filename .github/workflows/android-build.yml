name: BAD GYM Android QA Build
on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
  pull_request:
    branches: ['feature/grok-member-intelligence-flutter']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bad-gym-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources in the ephemeral CI checkout
        run: dart format lib test
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test --reporter expanded
      - name: Build device-specific debug QA APKs
        run: flutter build apk --debug --split-per-abi
      - name: Verify 64-bit Android APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          test -s "$APK"
      - name: Upload ARM64 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-qa-arm64-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
