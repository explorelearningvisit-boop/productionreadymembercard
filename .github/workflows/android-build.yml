name: BAD GYM Android Build
on:
  push:
    branches: [main, 'feature/grok-member-intelligence-flutter', 'rebuild/purple-neon-member-dashboard']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bad-gym-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Reuse downloaded Dart packages across hosted-runner jobs. The cache
      # is invalidated only when pubspec.yaml changes.
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Reuse Gradle distributions and dependency artifacts across builds.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.badgym .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test --reporter expanded
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-member-intelligence-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
