name: BAD GYM Android APK

on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bad-gym-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources in CI checkout
        run: dart format lib test

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter widget tests
        run: flutter test --reporter expanded

      - name: Build optimized ARM64 release QA APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK signature and report size
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          du -h "$APK"

      - name: Authenticate to Google Cloud for Firebase Test Lab
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud SDK
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run Firebase Test Lab on virtual and physical Android devices
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Virtual device lane
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout 5m \
            --results-dir="bad-gym-${GITHUB_RUN_NUMBER}-virtual"
          # Physical device lane
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=redfin,version=30,locale=en,orientation=portrait \
            --timeout 5m \
            --results-dir="bad-gym-${GITHUB_RUN_NUMBER}-physical"

      - name: Distribute QA APK with Firebase App Distribution
        if: ${{ success() && env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: bad-gym-qa
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "BAD GYM QA build ${{ github.run_number }} from ${{ github.sha }}"

      - name: Upload installable ARM64 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-member-card-arm64-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
