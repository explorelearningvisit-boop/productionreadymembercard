name: BAD GYM Android APK

on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bad-gym-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format Dart sources in CI checkout
        run: dart format lib test

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter widget tests
        run: flutter test --reporter expanded

      - name: Run debug launch smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            flutter build apk --debug --target-platform android-x64
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.badgym.bad_gym_member_intelligence/.MainActivity
            sleep 8
            adb logcat -d -v brief > build/emulator-logcat.txt
            if grep -E "Failed assertion|_elements.contains\\(element\\)|FATAL EXCEPTION" build/emulator-logcat.txt; then
              echo "Flutter runtime assertion or Android crash detected."
              exit 1
            fi
            test -n "$(adb shell pidof com.badgym.bad_gym_member_intelligence)"
            adb exec-out screencap -p > build/member-card-emulator.png

      - name: Upload Android emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-member-card-emulator-smoke
          path: build/member-card-emulator.png
          if-no-files-found: error
          retention-days: 7

      - name: Build optimized ARM64 release QA APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK signature and report size
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          du -h "$APK"

      - name: Upload installable ARM64 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-member-card-arm64-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
