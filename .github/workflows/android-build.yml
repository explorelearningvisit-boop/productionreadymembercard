name: BAD GYM Android APK
on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bad-gym-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Format Dart sources in CI checkout
        run: dart format lib test
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Flutter static analysis
        run: flutter analyze
      - name: Flutter widget tests
        run: flutter test --reporter expanded
      - name: Build universal Android debug APK
        run: flutter build apk --debug
      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
