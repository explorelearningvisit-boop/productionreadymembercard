name: BAD GYM Android APK

on:
  push:
    branches: ['grok/purple-neon-member-dashboard', 'grok/reference-glass-layered-dashboard']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bad-gym-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.yaml', 'android/**/gradle-wrapper.properties', 'android/**/*.gradle*', 'android/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install PulseVault image tooling
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13" "opencv-python-headless==4.10.0.84"

      - name: Generate real-alpha PulseVault cut-outs
        run: |
          python tools/build_pulsevault_emerald_derivatives.py \
            --root assets/material_pack/inbox/PulseVault \
            --out assets/material_pack/inbox/PulseVault/optimized

      - name: Audit generated PulseVault cut-outs
        run: |
          python tools/audit_pulsevault_assets.py \
            --root assets/material_pack/inbox/PulseVault/optimized \
            --manifest assets/material_pack/inbox/PulseVault/optimized/manifest.json \
            --json-out build/audits/pulsevault_optimized_audit.json \
            --markdown-out build/audits/pulsevault_optimized_audit.md

      - name: Archive optimized PulseVault image pack
        run: |
          mkdir -p build/audits
          zip -q -r build/audits/pulsevault_emerald_pearl_pack.zip assets/material_pack/inbox/PulseVault/optimized

      - name: Upload optimized PulseVault image pack
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-pulsevault-emerald-pearl-pack
          path: |
            build/audits/pulsevault_emerald_pearl_pack.zip
            build/audits/pulsevault_optimized_audit.json
            build/audits/pulsevault_optimized_audit.md
          if-no-files-found: error
          retention-days: 14

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Install Pillow for PulseVault image audit
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"

      - name: Audit PulseVault dimensions and transparency
        run: |
          python tools/audit_pulsevault_assets.py \
            --root assets/material_pack/inbox/PulseVault \
            --manifest assets/material_pack/inbox/PulseVault/manifest.json \
            --json-out build/audits/pulsevault_asset_audit.json \
            --markdown-out build/audits/pulsevault_asset_audit.md

      - name: Upload PulseVault asset audit report
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-pulsevault-asset-audit
          path: |
            build/audits/pulsevault_asset_audit.json
            build/audits/pulsevault_asset_audit.md
          if-no-files-found: error
          retention-days: 14

      - name: Archive original PulseVault images for visual review
        run: |
          mkdir -p build/audits
          zip -q -r build/audits/pulsevault_source_assets.zip assets/material_pack/inbox/PulseVault

      - name: Upload read-only PulseVault source images
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-pulsevault-source-assets
          path: build/audits/pulsevault_source_assets.zip
          if-no-files-found: error
          retention-days: 7

      - name: Format Dart sources in CI checkout
        run: dart format lib test

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter static analysis
        run: flutter analyze

      - name: Flutter widget tests with coverage
        run: flutter test --reporter expanded --coverage

      - name: Upload Flutter test coverage
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-flutter-test-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Build optimized ARM64 release QA APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK signature and report size
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee build/app/outputs/flutter-apk/app-release.apk.sha256
          du -h "$APK"

      - name: Authenticate to Google Cloud for Firebase Test Lab
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Google Cloud SDK
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run Firebase Test Lab on virtual and physical Android devices
        if: ${{ env.GCP_SERVICE_ACCOUNT_JSON != '' && env.GCP_PROJECT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          # Virtual device lane
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout 5m \
            --results-dir="bad-gym-${GITHUB_RUN_NUMBER}-virtual"
          # Physical device lane
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=redfin,version=30,locale=en,orientation=portrait \
            --timeout 5m \
            --results-dir="bad-gym-${GITHUB_RUN_NUMBER}-physical"

      - name: Distribute QA APK with Firebase App Distribution
        if: ${{ success() && env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: bad-gym-qa
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "BAD GYM QA build ${{ github.run_number }} from ${{ github.sha }}"

      - name: Upload installable ARM64 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-member-card-arm64-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
