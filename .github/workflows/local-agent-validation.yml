name: Windows Local Agent Validation

on:
  push:
    branches: [main, feat/badgym-windows-local-agent]
    paths:
      - "tools/badgym_local_agent/**"
      - "docs/LOCAL_AGENT_SETUP.md"
      - ".github/workflows/local-agent-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/badgym_local_agent/**"
      - "docs/LOCAL_AGENT_SETUP.md"
      - ".github/workflows/local-agent-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/badgym_local_agent/requirements.txt
      - name: Install MCP SDK
        run: python -m pip install -r tools/badgym_local_agent/requirements.txt ruff
      - name: Compile Python sources
        run: python -m compileall -q tools/badgym_local_agent
      - name: Unit tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tools/badgym_local_agent/tests -v
      - name: Ruff
        run: ruff check tools/badgym_local_agent
