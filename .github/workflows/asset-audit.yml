name: BAD GYM Asset Inbox Audit
on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bad-gym-asset-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image audit dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Inspect inbox images
        run: python scripts/audit_asset_inbox.py
      - name: Upload contact sheet and metadata
        uses: actions/upload-artifact@v4
        with:
          name: bad-gym-asset-audit-${{ github.sha }}
          path: build/asset-audit/
          if-no-files-found: error
          retention-days: 14
