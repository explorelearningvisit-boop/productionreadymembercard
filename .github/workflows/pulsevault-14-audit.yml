name: PulseVault 14 Image Audit
on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
    paths:
      - 'assets/material_pack/inbox/PulseVault/**'
      - 'scripts/audit_asset_inbox.py'
      - '.github/workflows/pulsevault-14-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pulsevault-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-pulsevault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Audit the 14 PulseVault PNGs only
        run: python scripts/audit_asset_inbox.py
      - name: Upload PulseVault contact sheet and metadata
        uses: actions/upload-artifact@v4
        with:
          name: pulsevault-14-visual-audit-${{ github.sha }}
          path: build/asset-audit/pulsevault/
          if-no-files-found: error
          retention-days: 14
