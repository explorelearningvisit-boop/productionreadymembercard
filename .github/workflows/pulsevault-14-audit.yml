name: PulseVault 14 Image Audit
on:
  push:
    branches: ['grok/purple-neon-member-dashboard']
    paths:
      - 'assets/material_pack/pulsevault/**'
      - 'scripts/audit_asset_inbox.py'
      - 'scripts/prepare_pulsevault_assets.py'
      - '.github/workflows/pulsevault-14-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pulsevault-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-pulsevault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert opaque shaker to transparent cutout and remove old source
        run: python scripts/prepare_pulsevault_assets.py
      - name: Audit exactly 14 PulseVault PNGs
        run: python scripts/audit_asset_inbox.py
      - name: Upload corrected images and audit metadata
        uses: actions/upload-artifact@v4
        with:
          name: pulsevault-14-visual-audit-${{ github.sha }}
          path: |
            build/asset-audit/pulsevault/
            assets/material_pack/pulsevault/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit corrected PulseVault asset in the same folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/material_pack/pulsevault/
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Replace opaque shaker with transparent PulseVault cutout"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
